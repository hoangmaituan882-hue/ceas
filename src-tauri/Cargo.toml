[package]
name = "ceas"
version = "0.1.0"
description = "Ceas — 设计素材库"
authors = ["ceas"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ceas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"
# 读 Pixcall 的 SQLite；bundled 免得用户机器缺 sqlite3.dll
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
